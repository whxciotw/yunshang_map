<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache, must-revalidate">
    <meta http-equiv="Cache" content="no-cache">
    <meta id="themeColorMeta" name="theme-color" content="#ffffff">
    <title>定制地图</title>
    <link rel="icon" type="image/png" href="images/favicon.png">

    <script src="js/jquery-1.12.4.min.js"></script>

    <script src="config.js?v=1.2.0"></script>
    <script src="js/utils.js?v=1.2.0"></script>
    <script src="js/language.js?v=1.2.0"></script>
    <script src="js/theme.js?v=1.2.0"></script>
    <script src="js/uiicons.js?v=1.2.0"></script>
    <script src="js/deviceicons.js?v=1.2.0"></script>
    <script src="js/entityutils.js?v=1.2.0"></script>

    <script src="js/dock.js?v=1.2.0"></script>
    <link rel="stylesheet" href="css/dock.css?v=1.2.0">

    <script src="js/map.js?v=1.2.0"></script>
    <link rel="stylesheet" href="css/map.css?v=1.2.0">
    <script src="js/coordinateutil.js?v=1.2.0"></script>

    <script type="text/javascript">
        if (GaodeMapjscode != "") {
            window._AMapSecurityConfig = {
                securityJsCode: GaodeMapjscode,
            }
        } else if (typeof GaodeMapserviceHost !== "undefined" && GaodeMapserviceHost != "") {
            window._AMapSecurityConfig = {
                serviceHost: GaodeMapserviceHost,
            }
        }
    </script>

    <script type="text/javascript">
        var gaodeMapAPI = "<script src='https://webapi.amap.com/maps?v=1.4.15&key=" + GaodeMapKey + "&plugin=AMap.MarkerClusterer,AMap.Scale,AMap.MapType,AMap.Driving,AMap.Walking,AMap.Riding'><\/script>";
        document.write(gaodeMapAPI);
    </script>
    <script src="https://webapi.amap.com/ui/1.0/main.js"></script>

    <script src="js/mapgaode.js?v=1.2.0"></script>
    <script src="js/mapbaidu.js?v=1.2.0"></script>
</head>

<body>
    <div id="mapContainer" class="mapContainer"></div>

    <div id="mapLoading" class="map-loading">
        <div class="map-loading-box">
            <span class="ys-spinner"></span>
            <span id="mapLoadingText">地图加载中…</span>
        </div>
    </div>

    <button type="button" id="btnFitView" class="ys-floating-btn" title="适配视野">
        <span id="fitViewIcon"></span>
    </button>

    <!-- 设备 / 轨迹 / 回家 面板 -->
    <div id="devicePanel" class="ys-panel" hidden>
        <div class="ys-panel-card" role="dialog" aria-label="设备列表">
            <div class="ys-panel-header" id="panelHeader">
                <div class="ys-panel-title">
                    <span id="panelTitleText">设备列表</span>
                    <span id="panelCount" class="ys-count">0</span>
                </div>
                <div class="ys-panel-header-actions">
                    <button type="button" id="btnPanelRefresh" class="ys-icon-btn" title="刷新设备位置"></button>
                    <button type="button" id="btnPanelClose" class="ys-icon-btn" title="关闭"></button>
                </div>
            </div>

            <div class="ys-tabs" role="tablist">
                <button type="button" class="ys-tab is-active" data-tab="devices" role="tab">设备</button>
                <button type="button" class="ys-tab" data-tab="track" role="tab">轨迹回放</button>
                <button type="button" class="ys-tab" data-tab="route" role="tab">回家路线</button>
            </div>

            <div class="ys-panel-body">
                <!-- 设备 -->
                <div class="ys-pane is-active" data-pane="devices">
                    <div class="ys-toolbar">
                        <span class="ys-search-icon" id="searchIcon"></span>
                        <input id="deviceSearch" class="ys-search" type="search" placeholder="搜索设备名称…"
                            autocomplete="off">
                    </div>
                    <div class="ys-device-list" id="deviceList"></div>
                    <div class="ys-empty" id="deviceEmpty" hidden>未发现可追踪的设备</div>
                </div>

                <!-- 轨迹回放 -->
                <div class="ys-pane" data-pane="track">
                    <div class="ys-field">
                        <label for="trackDeviceSelect">追踪设备</label>
                        <select id="trackDeviceSelect" class="ys-select"></select>
                    </div>
                    <div class="ys-field-row">
                        <label for="queryTimeFrom">开始</label>
                        <input id="queryTimeFrom" type="datetime-local" class="ys-input">
                    </div>
                    <div class="ys-field-row">
                        <label for="queryTimeTo">结束</label>
                        <input id="queryTimeTo" type="datetime-local" class="ys-input">
                    </div>
                    <div class="ys-chips">
                        <button type="button" class="ys-chip" data-range="today">今天</button>
                        <button type="button" class="ys-chip" data-range="yesterday">昨天</button>
                        <button type="button" class="ys-chip" data-range="7d">近7天</button>
                    </div>
                    <div class="ys-actions">
                        <button type="button" id="btnQuery" class="ys-btn ys-btn-primary">显示运动轨迹</button>
                    </div>
                    <div class="ys-field">
                        <label>动画速度</label>
                        <div class="ys-segmented ys-speed" id="trackSpeed" role="group">
                            <button type="button" data-speed="0.5">0.5×</button>
                            <button type="button" data-speed="1" class="is-active">1×</button>
                            <button type="button" data-speed="2">2×</button>
                            <button type="button" data-speed="4">4×</button>
                            <button type="button" data-speed="8">8×</button>
                        </div>
                    </div>
                    <div class="ys-actions" id="playbackActions" hidden>
                        <button type="button" id="btnDrawStart" class="ys-btn ys-btn-sm">开始动画</button>
                        <button type="button" id="btnDrawPause" class="ys-btn ys-btn-sm">暂停</button>
                        <button type="button" id="btnDrawResume" class="ys-btn ys-btn-sm">继续</button>
                        <button type="button" id="btnDrawStop" class="ys-btn ys-btn-sm">停止</button>
                    </div>
                    <div class="ys-hint" id="trackHint"></div>
                </div>

                <!-- 回家路线 -->
                <div class="ys-pane" data-pane="route">
                    <div class="ys-field">
                        <label>设备（可多选）</label>
                        <div id="routeDeviceList" class="ys-check-list"></div>
                    </div>
                    <div class="ys-field">
                        <label>出行方式</label>
                        <div class="ys-segmented" id="backhomeMode" role="group">
                            <button type="button" data-mode="drive" class="is-active">驾车</button>
                            <button type="button" data-mode="ride">骑行</button>
                            <button type="button" data-mode="walk">步行</button>
                        </div>
                    </div>
                    <div class="ys-actions">
                        <button type="button" id="btnBackhome" class="ys-btn ys-btn-primary">显示回家路线</button>
                    </div>
                    <div class="ys-hint" id="routeHint"></div>
                </div>
            </div>

            <div class="ys-panel-footer">
                <a href="javascript:;" id="linkManageDevices" class="ys-link">管理追踪设备</a>
                <span class="ys-footer-tip" id="footerTip"></span>
            </div>
        </div>
    </div>

    <!-- 主题选择面板 -->
    <div id="themePanel" class="ys-theme-panel">
        <div class="ys-theme-title">主题模式</div>
        <button type="button" class="ys-theme-option" data-theme-mode="light">
            <span class="ys-theme-dot ys-theme-dot-light"></span>浅色
        </button>
        <button type="button" class="ys-theme-option" data-theme-mode="dark">
            <span class="ys-theme-dot ys-theme-dot-dark"></span>深色
        </button>
        <button type="button" class="ys-theme-option" data-theme-mode="auto">
            <span class="ys-theme-dot ys-theme-dot-auto"></span>跟随系统
        </button>
    </div>

    <div id="ysToast" class="ys-toast"></div>

    <div id="dock">
        <img id="toolbar_zoomin" src="images/toolbar_zoomin_enable.png" width="42" alt="放大" title="放大">
        <img id="toolbar_zoomout" src="images/toolbar_zoomout_enable.png" width="42" alt="缩小" title="缩小">
        <img id="toolbar_traffic" src="images/toolbar_traffic_disable.png" width="42" alt="路况" title="实时路况">
        <img id="toolbar_homepoint" src="images/toolbar_homepoint_enable.png" width="42" alt="家" title="家的位置">
        <img id="toolbar_homerange" src="images/toolbar_homerange_enable.png" width="42" alt="家的范围" title="家的范围">
        <img id="toolbar_devicelist" src="images/toolbar_devicelist_disable.png" width="42" alt="设备列表"
            title="设备列表">
        <img id="toolbar_theme" src="images/toolbar_theme_auto.png" width="42" alt="主题模式" title="主题模式">
    </div>

    <script src="index.js?v=1.2.0"></script>
</body>

</html>
